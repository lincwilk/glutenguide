<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="robots" content="noindex, nofollow">
  <title>GlutenGuide — Update in progress</title>
  <style>
    :root{color-scheme:light;--ink:#25332d;--muted:#66716a;--brand:#143e35;--bg:#f6f3ec;--card:#fffefa;--line:#e5e0d5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;padding:24px;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,480px);padding:clamp(24px,7vw,40px);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 36px #25332d0d}
    .mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--brand);color:#f6f3ec;font:32px Georgia,serif}
    .eyebrow{margin:24px 0 8px;color:var(--muted);font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;color:var(--brand);font:clamp(30px,8vw,42px)/1.12 Georgia,serif;letter-spacing:-.03em}
    p{margin:16px 0 0;color:var(--muted)}
    .note{margin-top:24px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;color:var(--ink);font-size:14px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">G</div>
    <p class="eyebrow">GlutenGuide</p>
    <h1>We’re making some updates.</h1>
    <p>GlutenGuide is temporarily unavailable while we prepare the next version of the experience.</p>
    <div class="note">Please check back soon. Restaurant information and food-preparation practices should always be confirmed directly with the restaurant.</div>
  </main>
</body>
</html>
